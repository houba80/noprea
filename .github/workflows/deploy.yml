name: Deploy React App via FTP

on:
  push:
    branches:
      - main  # لو اسم البرانش بتاعك master، غير الكلمة دي لـ master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v3

    - name: ⚙️ Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18' # إصدار النود المناسب لـ Vite

    - name: 📦 Install Dependencies
      run: npm install

    - name: 🏗️ Build Project
      run: npm run build

    - name: 🚀 Sync files to Hostinger via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./dist/
        # ⚠️ ركز في السطر اللي جاي: ده مسار الفولدر على سيرفر Hostinger
        # لو الدومين الفرعي مربوط بفولدر معين، اكتب اسمه. لو بيترفع على الروت مباشرة سيبه كده.
        server-dir: ./